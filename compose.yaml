name: studyhub

x-backend: &backend
  build:
    context: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-studyhub}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-studyhub}
    COURSE_MANIFEST_PATH: /content/mobile_multiplatform/course_manifest.json
    PDF_STORAGE_PATH: /data/pdfs
    MODEL_ARTIFACT_PATH: /models/current
  volumes:
    - ./content:/content:ro
    - pdf_storage:/data/pdfs
    - ./ml/artifacts:/models:ro

services:
  storage-init:
    <<: *backend
    user: "0:0"
    command: ["chown", "10001:10001", "/data/pdfs"]
    restart: "no"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studyhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.ps1 to generate .env}
      POSTGRES_DB: ${POSTGRES_DB:-studyhub}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      storage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  pdf_storage:
